{{- if .Values.nodePool.enabled }}
{{- $s := .Values.global.spack }}
# Provisioner for {{ $s.description }} gitlab runners
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ required "global.spack.nodePool.name is required" $s.nodePool.name }}
  annotations:
    # Never let a failed HelmRelease uninstall take this NodePool with it --
    # deleting a NodePool cascades to its NodeClaims and drains the nodes.
    helm.sh/resource-policy: keep
spec:
  template:
    metadata:
      # Label all provisioned nodes as {{ $s.description }}
      labels:
        spack.io/pipeline: "true"
        {{ required "global.spack.nodeLabelKey is required" $s.nodeLabelKey }}: {{ required "global.spack.nodeLabelValue is required" $s.nodeLabelValue | quote }}
    spec:
      requirements:
      - key: "kubernetes.io/arch"
        operator: In
        values: [{{ $s.nodePool.arch | quote }}]

      {{- if $s.nodePool.instanceFamilies }}

      # Only provision nodes from instance families verified to support
      # {{ $s.description }}.
      - key: "karpenter.k8s.aws/instance-family"
        operator: In
        values:
{{ toYaml $s.nodePool.instanceFamilies | indent 10 }}
      {{- end }}

      # Instance Size
      - key: "karpenter.k8s.aws/instance-size"
        operator: In
        values:
{{ toYaml $s.nodePool.instanceSizes | indent 10 }}

      # Availability Zones
      - key: "topology.kubernetes.io/zone"
        operator: In
        values:
{{ toYaml $s.nodePool.zones | indent 10 }}

      # Only use spot instances for runners
      - key: "karpenter.sh/capacity-type"
        operator: In
        values: ["spot"]

      # Only provision nodes for Linux pods
      # Needed due to https://github.com/kubernetes-sigs/karpenter/issues/1009
      - key: "kubernetes.io/os"
        operator: In
        values: ["linux"]

      nodeClassRef:
        kind: EC2NodeClass
        name: default
        group: karpenter.k8s.aws

      # Taint these nodes so only pipeline pods will be scheduled on them.
      taints:
        - key: spack.io/runner-taint
          value: "true"
          effect: NoSchedule

      startupTaints:
        # See k8s/production/custom/runner-node-certificate-controller/
        # for explanation of this
        - key: "node.spack.io/certificate-pending"
          value: "true"
          effect: "NoSchedule"

  # Terminate nodes after 5 minutes of idle time
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m

  # Resource limits for this provisioner only
  limits:
    cpu: {{ $s.nodePool.limits.cpu }}
    memory: {{ $s.nodePool.limits.memory }}
{{- end }}
