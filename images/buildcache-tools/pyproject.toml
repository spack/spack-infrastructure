[project]
name = "buildcache-tools"
description = "S3 optimized tools for working with Spack projection build caches"
requires-python = ">=3.10"

[tool.ruff]
fix = true
target-version = "py310"
line-length = 99

src = ["pkg"]

[tool.ruff.format]
skip-magic-trailing-comma = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E731", "F811"]
typing-modules = ["spack.vendor.typing_extensions"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
section-order = [
  "future",
  "standard-library",
  "third-party",
  "vendor",
  "spack",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
vendor = ["spack.vendor"]
spack = ["spack"]

[tool.ruff.lint.per-file-ignores]
"var/spack/*/package.py" = ["F403", "F405", "F811", "F821"]
"*-ci-package.py" = ["F403", "F405", "F821"]
