[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics"
version = "0.1.0"
description = ""
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kitware, Inc.", email = "kitware@kitware.com" }]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django :: 5.1",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python",
]
requires-python = ">=3.13"
dependencies = [
    "cachetools==7.3.2",
    "celery[redis]==5.6.3",
    "dj-database-url==3.1.2",
    "dj-email-url==1.0.6",
    "django-click==2.5.0",
    "django-configurations[database,email]==2.5.1",
    "django-cors-headers==4.9.0",
    "django-extensions==4.1",
    "django-girder-utils==0.13.1",
    "django-ninja==1.8.0",
    "django-s3-file-field[minio]==1.1.0",
    "django==5.2.19",
    "gunicorn==26.2.0",
    "sentry-sdk[django,pure_eval]==2.75.0",
    "rich==15.0.0",
    "psycopg2-binary==2.9.13",
    "python-dateutil==3.0.0",
    "python-gitlab==8.6.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "whitenoise[brotli]==6.12.0",
]

[project.optional-dependencies]
dev = [
    "types-cachetools==7.0.0.20260713",
    "django-debug-toolbar==8.0.0",
    "ipython==9.18.1",
    "tox==4.67.15",
]

[tool.setuptools.packages.find]
include = ["analytics*"]

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '\.eggs|\.git|\.mypy_cache|\.tox|\.venv|_build|buck-out|build|dist'

[tool.isort]
profile = "black"
line_length = 100
# Sort by name, don't cluster "from" vs "import"
force_sort_within_sections = true
# Combines "as" imports on the same line
combine_as_imports = true
