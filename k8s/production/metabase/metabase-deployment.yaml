---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
    spec:
      containers:
        - name: metabase
          image: metabase/metabase:v0.65.3
          imagePullPolicy: "IfNotPresent"
          resources:
            requests:
              cpu: 500m  # observed 30-day peak ~370m
              memory: 3G
            limits:
              cpu: 2  # headroom for JVM startup/JIT bursts
              memory: 3G  # observed 30-day peak ~2.0Gi
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: metabase-config
            # SMTP settings for sending email through SES, managed by terraform
            - configMapRef:
                name: metabase-ses-config
          env:
            # The JVM sizes its max heap from the container memory limit
            # (25% by default), which would cap heap at ~750M under a 3G limit.
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=65"
            - name: MB_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: metabase-postgresql-password
                  key: postgresql-password
            - name: MB_EMAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metabase-ses-secrets
                  key: smtp-password
          # Metabase can take a few minutes to start on a busy node; hold off
          # liveness/readiness checks until it is up.
          startupProbe:
            httpGet:
              path: /
              port: 3000
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 3
      nodeSelector:
        spack.io/node-pool: base
