---
# Provisioner for base pods
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: base
spec:
  template:
    metadata:
      # Only provision nodes for pods specifying the base node pool
      labels:
        spack.io/node-pool: base

    spec:
      requirements:
        # Always use on-demand
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand"]

        # Only provision nodes for Linux pods
        # Needed due to https://github.com/kubernetes-sigs/karpenter/issues/1009
        - key: "kubernetes.io/os"
          operator: In
          values: ["linux"]

        # Pods with amd64-only images must set a kubernetes.io/arch nodeSelector
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64", "arm64"]

        # Exclude burstable (T-family) and other special-purpose instance types
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c", "m", "r"]

        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["5"]

        # Cap node size to limit the blast radius of a single node being disrupted
        - key: "karpenter.k8s.aws/instance-cpu"
          operator: Lt
          values: ["33"]

      nodeClassRef:
        kind: EC2NodeClass
        name: default
        group: karpenter.k8s.aws

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      # Karpenter's default budget, which is dropped once any budget is specified
      - nodes: "10%"
      # Only consolidate one underutilized node at a time
      - nodes: "1"
        reasons: ["Underutilized"]

  limits:
    cpu: 128
