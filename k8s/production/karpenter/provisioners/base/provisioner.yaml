---
# Provisioner for base pods
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: base
spec:
  template:
    metadata:
      # Only provision nodes for pods specifying the base node pool
      labels:
        spack.io/node-pool: base

    spec:
      requirements:
        # Prefer spot, falling back to on-demand when spot capacity is unavailable.
        # Pods that can't tolerate interruption select
        # karpenter.sh/capacity-type: on-demand.
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]

        # Only provision nodes for Linux pods
        # Needed due to https://github.com/kubernetes-sigs/karpenter/issues/1009
        - key: "kubernetes.io/os"
          operator: In
          values: ["linux"]

      nodeClassRef:
        kind: EC2NodeClass
        name: default
        group: karpenter.k8s.aws

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m

  limits:
    cpu: 128
