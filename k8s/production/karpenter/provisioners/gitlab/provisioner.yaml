---
# Provisioner for gitlab pods
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gitlab
spec:
  template:
    metadata:
      # Only provision nodes for pods specifying the gitlab node pool
      labels:
        spack.io/node-pool: gitlab
    spec:
      requirements:
        # Always use amd64 nodes
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]

        # Prefer spot, falling back to on-demand when spot capacity is unavailable.
        # Pods that can't tolerate interruption select
        # karpenter.sh/capacity-type: on-demand. Gitaly has its own pool.
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]

        # Only provision nodes for Linux pods
        # Needed due to https://github.com/kubernetes-sigs/karpenter/issues/1009
        - key: "kubernetes.io/os"
          operator: In
          values: ["linux"]

      nodeClassRef:
        kind: EC2NodeClass
        name: default
        group: karpenter.k8s.aws

  # Terminate nodes after 5 minutes of under-utilization
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      # ┌───────────── minute (0 - 59)
      # │ ┌───────────── hour (0 - 23)
      # │ │ ┌───────────── day of the month (1 - 31)
      # │ │ │ ┌───────────── month (1 - 12)
      # │ │ │ │ ┌───────────── day of the week (0 - 6) (Sunday to Saturday;
      # │ │ │ │ │                                   7 is also Sunday on some systems)
      # │ │ │ │ │                                   OR sun, mon, tue, wed, thu, fri, sat
      # │ │ │ │ │
      # * * * * *
      #
      # Only consolidate underutilized or drifted nodes between 4AM and 8AM UTC
      # (apply this in reverse by disallowing it from 8AM to 4AM UTC).
      # These evict running GitLab pods, which can cause 503s (#1366).
      - schedule: "0 8 * * *"
        duration: 20h
        nodes: "0"
        reasons: ["Underutilized", "Drifted"]

      # Empty nodes (only daemonsets left) can be removed at any time, since
      # no GitLab pods are evicted. Without this, nodes added during a
      # webservice/sidekiq HPA scale-up sit idle until the 4AM window.
      - nodes: "20%"
        reasons: ["Empty"]
