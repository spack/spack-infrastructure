---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: refresh-gitaly-bundle
  namespace: gitlab
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: refresh-gitaly-bundle
  namespace: gitlab
rules:
  # Permissions needed to run the refresh-gitaly-bundle CronJob.
  - apiGroups: ["", "apps"]
    resources: ["deployments", "pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: refresh-gitaly-bundle
  namespace: gitlab
subjects:
  - kind: ServiceAccount
    name: refresh-gitaly-bundle
roleRef:
  kind: Role
  name: refresh-gitaly-bundle
  apiGroup: rbac.authorization.k8s.io
