---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: gitlab

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: pipeline
automountServiceAccountToken: false

---
# Permissions for the GitLab Kubernetes executor *manager* to create/exec/attach job pods and
# manage the ConfigMaps/Secrets it mounts into them. Bound ONLY to the manager SA
# (gitlab/runner) below - never to the build-pod SA (pipeline/runner).
# TODO: narrow from a ClusterRole to a Role scoped to the `pipeline` namespace (jobs only run
# there) once we've confirmed the executor needs nothing cluster-wide.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: gitlab-runner
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "secrets", "configmaps", "pods/attach"]
    verbs: ["get", "watch", "list", "update", "create", "patch", "delete"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: gitlab-runner
subjects:
  - kind: ServiceAccount
    name: runner
    namespace: gitlab
roleRef:
  kind: ClusterRole
  name: gitlab-runner
  apiGroup: rbac.authorization.k8s.io
