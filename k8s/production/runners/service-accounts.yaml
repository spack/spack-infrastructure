---
# Manager SA for the `public` (and `signing`) runners. Creates build pods in `pipeline`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: gitlab

---
# Manager SA for the `protected` runners. Creates build pods in `pipeline-protected`.
# Kept separate from `gitlab/runner` so that a compromised public manager cannot read
# or exec into protected build pods, and vice versa.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-protected
  namespace: gitlab

---
# Build-pod SA for `public` jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: pipeline
automountServiceAccountToken: false

---
# Build-pod SA for `protected` jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: pipeline-protected
automountServiceAccountToken: false

---
# Permissions for the GitLab Kubernetes executor *manager* to create/exec/attach job pods
# and manage the ConfigMaps/Secrets it mounts into them.
#
# These are namespaced Roles rather than a ClusterRole: each manager SA is granted access
# only in the namespace its own build pods run in, and never to the build-pod SAs
# (pipeline/runner, pipeline-protected/runner).
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: gitlab-runner
  namespace: pipeline
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "secrets", "configmaps", "pods/attach"]
    verbs: ["get", "watch", "list", "update", "create", "patch", "delete"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: gitlab-runner
  namespace: pipeline
subjects:
  - kind: ServiceAccount
    name: runner
    namespace: gitlab
roleRef:
  kind: Role
  name: gitlab-runner
  apiGroup: rbac.authorization.k8s.io

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: gitlab-runner
  namespace: pipeline-protected
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "secrets", "configmaps", "pods/attach"]
    verbs: ["get", "watch", "list", "update", "create", "patch", "delete"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: gitlab-runner
  namespace: pipeline-protected
subjects:
  - kind: ServiceAccount
    name: runner-protected
    namespace: gitlab
roleRef:
  kind: Role
  name: gitlab-runner
  apiGroup: rbac.authorization.k8s.io
