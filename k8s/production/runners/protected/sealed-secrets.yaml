# Signing material mounted into *protected* build pods only. This lives in the
# `pipeline-protected` namespace so that public build pods, which share a cluster but not a
# namespace, have no path to it. SealedSecret ciphertext is bound to its namespace, so this
# had to be re-sealed when it moved out of `pipeline`.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: spack-intermediate-ci-signing-key
  namespace: pipeline-protected
spec:
  encryptedData:
    bootstrap_gcc_key.pub: 
    e4s.gpg: 
    intermediate_ci_signing_key.gpg: 
    spack_public_key.gpg: 
  template:
    metadata:
      annotations:
        kustomize.toolkit.fluxcd.io/reconcile: disabled
        sealedsecrets.bitnami.com/managed: "true"
      name: spack-intermediate-ci-signing-key
      namespace: pipeline-protected
    type: Opaque
