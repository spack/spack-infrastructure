---
# graviton4 runner type: the glr-graviton4 NodePool plus its public and
# protected runners. Everything not set here comes from
# charts/spack-runner-type/values.yaml (including gitlabUrl).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runner-graviton4
  namespace: gitlab
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/spack-runner-type
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  dependsOn:
    - name: gitlab
      namespace: gitlab

  valuesFrom:
    # See terraform/modules/spack_aws_k8s/sentry.tf
    - kind: ConfigMap
      name: gitlab-runner-sentry-config
      valuesKey: sentryDsn
      targetPath: public.sentryDsn
    - kind: ConfigMap
      name: gitlab-runner-sentry-config
      valuesKey: sentryDsn
      targetPath: protected.sentryDsn

  values:
    global:
      spack:
        description: graviton4
        nodeLabelKey: spack.io/graviton
        nodeLabelValue: "4"
        nodeAffinityComment: Schedule this pod on only graviton 4 nodes
        schedulesOn: ["4"]
        podAffinityWeight: 1
        helperImage: registry.gitlab.com/gitlab-org/gitlab-runner/gitlab-runner-helper:arm64-latest
        nodePool:
          name: glr-graviton4
          arch: arm64
          # Data gleaned from https://aws.amazon.com/ec2/instance-types/
          instanceFamilies:
            - "c8g"
            - "m8g"
            - "r8g"

    public:
      fullnameOverride: runner-graviton4-pub-gitlab-runner
      spack:
        cpuLimitMax: "32"
      runners:
        tags: "arm,aarch64,graviton4,neoverse_v2,small,medium,large,huge,public,aws,spack"

    protected:
      fullnameOverride: runner-graviton4-prot-gitlab-runner
      replicas: 2
      concurrent: 30
      spack:
        cpuLimitMax: "32"
      runners:
        tags: "arm,aarch64,graviton4,neoverse_v2,small,medium,large,huge,protected,aws,spack"
