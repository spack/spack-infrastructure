---
# graviton3 runner type: the glr-graviton3 NodePool plus its public and
# protected runners. Everything not set here comes from
# charts/spack-runner-type/values.yaml (including gitlabUrl).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runner-graviton3
  namespace: gitlab
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/spack-runner-type
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  dependsOn:
    - name: gitlab
      namespace: gitlab

  valuesFrom:
    # See terraform/modules/spack_aws_k8s/sentry.tf
    - kind: ConfigMap
      name: gitlab-runner-sentry-config
      valuesKey: sentryDsn
      targetPath: public.sentryDsn
    - kind: ConfigMap
      name: gitlab-runner-sentry-config
      valuesKey: sentryDsn
      targetPath: protected.sentryDsn

  values:
    global:
      spack:
        description: graviton3
        nodeLabelKey: spack.io/graviton
        nodeLabelValue: "3"
        nodeAffinityComment: Schedule this pod on only graviton 3 nodes
        schedulesOn: ["3"]
        podAffinityWeight: 1
        helperImage: registry.gitlab.com/gitlab-org/gitlab-runner/gitlab-runner-helper:arm-latest
        nodePool:
          name: glr-graviton3
          arch: arm64
          # Data gleaned from https://aws.amazon.com/ec2/graviton/
          instanceFamilies:
            - "c7g"
            - "m7g"
            - "r7g"

    public:
      fullnameOverride: runner-graviton3-pub-gitlab-runner
      spack:
        cpuLimitMax: "32"
      runners:
        tags: "arm,aarch64,graviton,graviton3,neoverse_v1,small,medium,large,huge,public,aws,spack"

    protected:
      fullnameOverride: runner-graviton3-prot-gitlab-runner
      replicas: 2
      concurrent: 30
      spack:
        cpuLimitMax: "32"
      runners:
        tags: "arm,aarch64,graviton,graviton3,neoverse_v1,small,medium,large,huge,protected,aws,spack"
