---
# x86_64_v2 runner type: the glr-x86-64-v2 NodePool plus its public and
# protected runners. Everything not set here comes from
# charts/spack-runner-type/values.yaml (including gitlabUrl).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runner-x86-v2
  namespace: gitlab
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/spack-runner-type
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  dependsOn:
    - name: gitlab
      namespace: gitlab

  valuesFrom:
    # See terraform/modules/spack_aws_k8s/sentry.tf
    - kind: ConfigMap
      name: gitlab-runner-sentry-config
      valuesKey: sentryDsn
      targetPath: public.sentryDsn
    - kind: ConfigMap
      name: gitlab-runner-sentry-config
      valuesKey: sentryDsn
      targetPath: protected.sentryDsn

  values:
    global:
      spack:
        description: x86_64_v2
        nodeLabelKey: spack.io/x86_64
        nodeLabelValue: "v2"
        nodeAffinityComment: Schedule this pod on any node with x86_64 >= v2
        schedulesOn: ["v2", "v3", "v4"]
        preferenceComment: x86-64-v2
        nodePreferences:
          - {value: "v2", weight: 3}
          - {value: "v3", weight: 2}
          - {value: "v4", weight: 1}
        podAffinityWeight: 4
        nodePool:
          name: glr-x86-64-v2
          arch: amd64
          # v2 is the baseline microarch, so every amd64 family qualifies.
          instanceFamilies: []

    public:
      fullnameOverride: runner-x86-v2-pub-gitlab-runner
      spack:
        cpuLimitMax: "24"
        # This is the only runner carrying the `service` tags, and service jobs
        # use CI_OIDC_REQUIRED to skip OIDC setup.
        oidcOptional: true
        podAffinityNote: true
      runners:
        tags: "x86_64,x86_64_v2,small,medium,large,huge,public,aws,spack,service,service_noop"

    protected:
      fullnameOverride: runner-x86-v2-prot-gitlab-runner
      spack:
        cpuLimitMax: "32"
      runners:
        tags: "x86_64,x86_64_v2,small,medium,large,huge,protected,aws,spack"
