---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kitware
  namespace: cdash
spec:
  interval: 10m
  url: https://kitware.github.io/helm

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cdash
  namespace: cdash
spec:
  interval: 10m
  chart:
    spec:
      chart: cdash
      version: 0.21.1 # v5.5.1
      sourceRef:
        kind: HelmRepository
        name: kitware
  # The chart unconditionally renders an nginx Ingress, but cdash.spack.io
  # is exposed via the HTTPRoute in httproutes.yaml, so drop the Ingress.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
              name: cdash-website
            patch: |
              $patch: delete
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: cdash-website
  values:
    nodeSelector:
      spack.io/node-pool: base

    cdash:
      host: cdash.spack.io
      serviceAccountName: cdash
      externalSecret: cdash-extra
      website:
        resources:
          requests:
            memory: 512Mi
      worker:
        replicas: 2
        resources:
          requests:
            memory: 512Mi

    postgresql:
      enabled: false

    minio:
      enabled: false
