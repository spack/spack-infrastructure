---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 10m
  url: https://grafana.github.io/helm-charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: loki
      version: 7.3.0 # loki@3.6.12
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    # Pod logs + k8s events are a few GB/day at most, well within what a single
    # binary can handle. Chunks and index live in S3 (see
    # terraform/modules/spack_aws_k8s/loki.tf), so the local PVC only holds the
    # WAL and compactor scratch space.
    deploymentMode: SingleBinary

    loki:
      image:
        tag: 3.6.12

      # Single-tenant. Only Alloy (monitoring namespace) and Grafana talk to Loki.
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      schemaConfig:
        configs:
          - from: "2026-09-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      storage:
        type: s3
        bucketNames:
          # The ruler is disabled, but the chart still templates this bucket name.
          chunks: spack-loki
          ruler: spack-loki
        s3:
          region: us-east-1
          # Credentials come from IRSA (the "loki" ServiceAccount is created by Terraform).

      limits_config:
        retention_period: 720h # 30 days
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        volume_enabled: true
        # Guardrails so a single noisy pod can't take Loki down.
        ingestion_rate_mb: 16
        ingestion_burst_size_mb: 32
        per_stream_rate_limit: 5MB
        per_stream_rate_limit_burst: 20MB
        max_line_size: 256KB
        max_line_size_truncate: true
        max_label_names_per_series: 15
        max_global_streams_per_user: 10000

      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: s3
        retention_delete_delay: 2h

      ingester:
        chunk_encoding: snappy

      pattern_ingester:
        enabled: false

      analytics:
        reporting_enabled: false

    serviceAccount:
      create: false
      name: loki # See terraform/modules/spack_aws_k8s/loki.tf

    singleBinary:
      replicas: 1
      nodeSelector:
        spack.io/node-pool: base
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
      persistence:
        enabled: true
        storageClass: gp3
        size: 20Gi
        # The PVC only holds the WAL; chunks are flushed to S3.
        whenDeleted: Retain

    # Grafana talks to the single binary service directly, no need for the nginx gateway.
    gateway:
      enabled: false

    ruler:
      enabled: false

    # These default to large memcached StatefulSets (the chunks cache alone
    # requests ~10 GiB). Not worth it at our volume.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    lokiCanary:
      enabled: false
    test:
      enabled: false

    # Only used to load alerting rules from ConfigMaps into the (disabled) ruler.
    sidecar:
      rules:
        enabled: false

    monitoring:
      serviceMonitor:
        enabled: true
        metricsInstance:
          enabled: false
      dashboards:
        enabled: false
      rules:
        enabled: false

    # Zero out the SimpleScalable components (defaults are 3 replicas each).
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
